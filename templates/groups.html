<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Группы — Mystical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical</a>

        <form action="{{ url_for('search') }}" method="GET" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="Поиск...">
        </form>

        <div class="user-info">
            <a href="{{ url_for('messages') }}" class="user-link" title="Сообщения">✉️</a>
            <a href="{{ url_for('profile', username=session.username) }}" class="user-link">
                Привет, {{ session.username }}
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="feed-container">
        <a href="{{ url_for('messages') }}" class="chat-back" style="display:inline-block;margin-bottom:16px;">← К сообщениям</a>

        <div class="tag-header">
            <h2 class="tag-title">👥 Группы</h2>
            <p class="tag-count">Ты в {{ groups|length }} группах</p>
            <a href="{{ url_for('create_group') }}" class="btn-primary btn-small" style="margin-top:12px;display:inline-block;">+ Создать группу</a>
        </div>

        <div class="dialogs-list">
            {% if groups %}
                {% for g in groups %}
                    <a href="{{ url_for('group_chat', group_id=g.id) }}" class="dialog-row">
                        <div class="dialog-item">
                            <div class="dialog-avatar" style="background:#7c3aed;">👥</div>
                            <div class="dialog-body">
                                <div class="dialog-name">{{ g.name }}</div>
                                <div class="dialog-preview">{{ g.members|length }} участников</div>
                            </div>
                        </div>
                    </a>
                {% endfor %}
            {% else %}
                <p class="empty">Ты пока не в группах. <a href="{{ url_for('create_group') }}">Создай первую!</a></p>
            {% endif %}
        </div>
    </main>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
