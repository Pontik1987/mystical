<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать профиль — Mystical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical</a>

        <form action="{{ url_for('search') }}" method="GET" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="Поиск...">
        </form>

        <div class="user-info">
            <a href="{{ url_for('profile', username=session.username) }}" class="user-link">
                Привет, {{ session.username }}
            </a>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="feed-container">
        <div class="edit-card">
            <h2>Редактировать профиль</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="flash">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('edit_profile') }}">
                <label class="form-label">О себе</label>
                <textarea name="bio" class="form-textarea" maxlength="300"
                          placeholder="Расскажи о себе...">{{ user.bio or '' }}</textarea>
                <p class="form-hint">Макс 300 символов</p>

                <label class="form-label">Город</label>
                <input type="text" name="city" class="form-input" maxlength="100"
                       placeholder="Например: Москва" value="{{ user.city or '' }}">

                <label class="form-label">Сайт / соцсеть</label>
                <input type="url" name="website" class="form-input" maxlength="200"
                       placeholder="https://..." value="{{ user.website or '' }}">

                <div class="edit-actions">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <a href="{{ url_for('profile', username=user.username) }}" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
