<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Клип {{ clip.author.username }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="clips-body">
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical</a>
        <div class="user-info">
            <a href="{{ url_for('clips') }}" class="user-link">← Все клипы</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="clips-container">
        <div class="clip-card">
            <video class="clip-video" src="{{ url_for('static', filename='clips/' + clip.video) }}" 
                   controls autoplay loop playsinline></video>

            <div class="clip-overlay">
                <div class="clip-author">
                    {% if clip.author.avatar %}
                        <img src="{{ url_for('static', filename='avatars/' + clip.author.avatar) }}" class="clip-avatar" alt="">
                    {% else %}
                        <div class="clip-avatar-text">{{ clip.author.username[0]|upper }}</div>
                    {% endif %}
                    <a href="{{ url_for('profile', username=clip.author.username) }}" class="clip-author-name">
                        @{{ clip.author.username }}
                    </a>
                </div>
                {% if clip.caption %}
                    <div class="clip-caption">{{ clip.caption }}</div>
                {% endif %}
                {% if clip.music %}
                    <div class="clip-music">♪ {{ clip.music }}</div>
                {% endif %}
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
