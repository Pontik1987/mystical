<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать пост — Mystical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical</a>

        <form action="{{ url_for('search') }}" method="GET" class="search-form">
            <input type="text" name="q" class="search-input" placeholder="Поиск...">
        </form>

        <div class="user-info">
            <a href="{{ url_for('profile', username=session.username) }}" class="user-link">
                Привет, {{ session.username }}
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="feed-container">
        <div class="edit-card">
            <h2>✏️ Редактировать пост</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="flash">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('edit_post', post_id=post.id) }}">
                <label class="form-label">Текст поста</label>
                <textarea name="content" id="edit-post-content" class="form-textarea" required autofocus>{{ post.content }}</textarea>
                <button type="button" class="emoji-trigger" data-target="edit-post-content" title="Эмодзи" style="margin-top:6px;">😀 Эмодзи</button>

                <div class="font-selector" style="margin-top:12px;">
                    <span class="font-selector-label">Шрифт:</span>
                    <label class="font-btn">
                        <input type="radio" name="font_style" value="sans" {% if post.font_style == 'sans' or not post.font_style %}checked{% endif %}>
                        <span class="font-preview font-sans">Aa</span>
                    </label>
                    <label class="font-btn">
                        <input type="radio" name="font_style" value="serif" {% if post.font_style == 'serif' %}checked{% endif %}>
                        <span class="font-preview font-serif">Aa</span>
                    </label>
                    <label class="font-btn">
                        <input type="radio" name="font_style" value="mono" {% if post.font_style == 'mono' %}checked{% endif %}>
                        <span class="font-preview font-mono">Aa</span>
                    </label>
                    <label class="font-btn">
                        <input type="radio" name="font_style" value="cursive" {% if post.font_style == 'cursive' %}checked{% endif %}>
                        <span class="font-preview font-cursive">Aa</span>
                    </label>
                    <label class="font-btn">
                        <input type="radio" name="font_style" value="fantasy" {% if post.font_style == 'fantasy' %}checked{% endif %}>
                        <span class="font-preview font-fantasy">Aa</span>
                    </label>
                </div>

                <div class="edit-actions">
                    <button type="submit" class="btn-primary">Сохранить</button>
                    <a href="{{ url_for('index') }}" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>
<script src="{{ url_for('static', filename='emoji.js') }}"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
