<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать клип — Mystical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="logo">Mystical</a>
        <div class="user-info">
            <a href="{{ url_for('clips') }}" class="user-link">← Клипы</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Тема">🌙</button>
            <a href="{{ url_for('logout') }}" class="btn-logout">Выйти</a>
        </div>
    </header>

    <main class="feed-container">
        <div class="edit-card">
            <h2>🎬 Новый клип</h2>
            <p class="form-hint" style="margin-bottom:16px;">Вертикальное видео (mp4, webm, mov), до 100 МБ</p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                        <div class="flash">{{ msg }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" enctype="multipart/form-data">
                <label class="form-label">Видео</label>
                <input type="file" name="video" class="form-input" accept="video/*" required>

                <label class="form-label">Подпись (необязательно)</label>
                <textarea name="caption" id="clip-caption" class="form-textarea" maxlength="300" placeholder="Что в клипе?"></textarea>
                <button type="button" class="emoji-trigger" data-target="clip-caption" title="Эмодзи" style="margin-top:6px;">😀 Эмодзи</button>

                <label class="form-label">Музыка (необязательно)</label>
                <input type="text" name="music" class="form-input" maxlength="200" placeholder="Название трека">

                <div class="edit-actions">
                    <button type="submit" class="btn-primary">Опубликовать клип</button>
                    <a href="{{ url_for('clips') }}" class="btn-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </main>

    <script src="{{ url_for('static', filename='emoji.js') }}"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
